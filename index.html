<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>សំណួរត្រៀម Cybersecurity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b1020; --bg2:#121a33; --card:#161f3d; --card2:#1d2950;
  --line:#2a3763; --txt:#e8ecf8; --dim:#96a3c8;
  --acc:#3ddc97; --acc2:#38bdf8; --warn:#fbbf24; --bad:#f4626c;
  --r:14px;
}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#1a2550 0%,var(--bg) 60%);
  background-attachment:fixed; color:var(--txt); min-height:100vh;
  font-family:'Noto Sans Khmer','Khmer OS Battambang','Khmer OS','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.75; padding:16px 14px 60px;
}
.wrap{max-width:760px;margin:0 auto}
.en{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.55}

/* header */
header{text-align:center;padding:22px 0 20px}
header h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
header h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--dim);font-size:.88rem;margin-top:6px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.menu{display:grid;gap:12px}
.tile{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:16px;text-align:start;width:100%;color:inherit;font:inherit}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile .ic{font-size:1.7rem;flex:0 0 auto}
.tile b{display:block;font-size:1.05rem;font-weight:700}
.tile small{color:var(--dim);font-size:.82rem}

/* buttons */
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{background:var(--acc);color:#06281c;font-weight:700;padding:11px 20px;border-radius:10px;transition:.15s;font-size:.95rem}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;background:var(--bg2);transition:.15s}
.chip:hover{border-color:var(--acc2)}
.chip.on{background:var(--acc);color:#06281c;border-color:var(--acc);font-weight:700}

/* progress */
.bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s;border-radius:99px}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim)}

/* question */
.qnum{color:var(--acc2);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.qtext{font-size:1.06rem;font-weight:600;margin:8px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;padding:13px 15px;margin-bottom:9px;
  background:var(--bg2);border:1.5px solid var(--line);border-radius:11px;transition:.15s;font-size:.95rem}
.opt:hover:not(.locked){border-color:var(--acc2);background:var(--card2)}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--card2);display:grid;place-items:center;
  font-size:.8rem;font-weight:700;color:var(--dim);font-family:'Inter',sans-serif}
.opt.sel{border-color:var(--acc2)}.opt.sel .k{background:var(--acc2);color:#04202e}
.opt.ok{border-color:var(--acc);background:rgba(61,220,151,.1)}.opt.ok .k{background:var(--acc);color:#06281c}
.opt.no{border-color:var(--bad);background:rgba(244,98,108,.1)}.opt.no .k{background:var(--bad);color:#2b0508}
.opt.locked{cursor:default}
.expl{border-inline-start:3px solid var(--acc);background:rgba(61,220,151,.07);padding:12px 15px;border-radius:0 10px 10px 0;margin-top:14px;font-size:.92rem}
.expl b{color:var(--acc);display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.verdict{font-weight:700;margin-top:14px;font-size:.95rem}
.verdict.ok{color:var(--acc)}.verdict.no{color:var(--bad)}

/* timer */
.timer{font-family:'Inter',monospace;font-weight:700;font-size:.95rem;color:var(--warn)}

/* results */
.score{text-align:center;padding:26px 10px}
.score .big{font-size:3.4rem;font-weight:800;font-family:'Inter',sans-serif;line-height:1;
  background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.score .sub{color:var(--dim);margin-top:8px}
.grade{display:inline-block;margin-top:14px;padding:6px 18px;border-radius:999px;font-weight:700;font-size:.9rem}

/* flashcards */
.fc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;background:var(--card)}
.fc>button{width:100%;text-align:start;padding:16px 18px;font-weight:600;display:flex;gap:12px;align-items:center;font-size:.98rem}
.fc>button .n{flex:0 0 28px;height:28px;border-radius:8px;background:var(--card2);color:var(--acc2);
  display:grid;place-items:center;font-size:.82rem;font-weight:700;font-family:'Inter',sans-serif}
.fc>button .ar{margin-inline-start:auto;color:var(--dim);transition:.2s;flex:0 0 auto}
.fc.open>button .ar{transform:rotate(90deg)}
.fcbody{display:none;padding:4px 18px 20px;border-top:1px solid var(--line);font-size:.93rem}
.fc.open .fcbody{display:block}
.fcbody ul{padding-inline-start:20px;margin:8px 0}
.fcbody li{margin-bottom:7px}
.fcbody p{margin:9px 0}
.fcbody strong{color:var(--acc)}
.fcbody table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.82rem}
.fcbody th,.fcbody td{border:1px solid var(--line);padding:7px 9px;text-align:start}
.fcbody th{background:var(--card2);color:var(--acc2);font-weight:700}
.tblwrap{overflow-x:auto}

.hide{display:none!important}
footer{text-align:center;color:var(--dim);font-size:.78rem;padding:30px 0 10px;line-height:2}
.review-item{border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:10px;background:var(--bg2)}
.review-item .r1{font-size:.93rem;font-weight:600;margin-bottom:8px}
.review-item .r2{font-size:.86rem;color:var(--bad)}
.review-item .r3{font-size:.86rem;color:var(--acc)}
.review-item .r4{font-size:.85rem;color:var(--dim);margin-top:7px}
@media(max-width:480px){body{padding:10px 10px 50px}.card{padding:15px}header h1{font-size:1.2rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>សំណួរត្រៀម <span>Cybersecurity</span></h1>
    <p>១១៧ សំណួរជម្រើស + ៩ សំណួរខ្លី</p>
  </header>

  <!-- HOME -->
  <div id="home">
    <div class="menu">
      <button class="tile" onclick="startStudySetup()">
        <span class="ic">📖</span>
        <span><b>របៀបរៀន — Study</b><small>ឆ្លើយ ហើយឃើញចម្លើយត្រឹមត្រូវ និងការពន្យល់ភ្លាមៗ</small></span>
      </button>
      <button class="tile" onclick="startExamSetup()">
        <span class="ic">⏱️</span>
        <span><b>របៀបប្រឡង — Exam</b><small>មានពេលកំណត់ សំណួរច្របល់ ដឹងពិន្ទុនៅចុងបញ្ចប់</small></span>
      </button>
      <button class="tile" onclick="show('flash')">
        <span class="ic">🗂️</span>
        <span><b>សំណួរខ្លី — Short Answer</b><small>៩ សំណួរសរសេរឆ្លើយ ព្រមទាំងចម្លើយគំរូ</small></span>
      </button>
    </div>
  </div>

  <!-- SETUP -->
  <div id="setup" class="hide">
    <div class="card">
      <div id="setupTitle" style="font-weight:700;font-size:1.1rem;margin-bottom:4px"></div>
      <div style="color:var(--dim);font-size:.86rem;margin-bottom:14px">ជ្រើសរើសមេរៀន</div>
      <div class="chips" id="catChips"></div>
      <div id="countBox" class="hide" style="margin-top:18px">
        <div style="color:var(--dim);font-size:.86rem;margin-bottom:4px">ចំនួនសំណួរ</div>
        <div class="chips" id="countChips"></div>
      </div>
      <div class="row" style="margin-top:22px">
        <button class="btn" onclick="beginQuiz()">ចាប់ផ្តើម</button>
        <button class="btn ghost" onclick="show('home')">ថយក្រោយ</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hide">
    <div class="card">
      <div class="row spread">
        <span class="qnum" id="qCounter"></span>
        <span class="timer" id="timer"></span>
      </div>
      <div class="bar"><i id="progBar" style="width:0%"></i></div>
      <div class="qtext en" id="qText"></div>
      <div id="opts"></div>
      <div id="feedback"></div>
      <div class="row spread" style="margin-top:20px">
        <button class="btn ghost" id="btnPrev" onclick="nav(-1)">← ថយក្រោយ</button>
        <button class="btn" id="btnNext" onclick="nav(1)">បន្ទាប់ →</button>
      </div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" onclick="quitQuiz()">បញ្ឈប់ និងត្រឡប់ទៅដើម</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="hide">
    <div class="card score">
      <div class="big" id="scorePct"></div>
      <div class="sub" id="scoreText"></div>
      <div class="grade" id="scoreGrade"></div>
      <div class="sub" id="scoreTime" style="font-size:.84rem"></div>
    </div>
    <div class="row" style="justify-content:center;margin-bottom:16px">
      <button class="btn" onclick="retry()">ធ្វើម្តងទៀត</button>
      <button class="btn ghost" onclick="show('home')">ទៅទំព័រដើម</button>
    </div>
    <div id="reviewBox"></div>
  </div>

  <!-- FLASHCARDS -->
  <div id="flash" class="hide">
    <div id="fcList"></div>
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="btn ghost" onclick="show('home')">← ទៅទំព័រដើម</button>
    </div>
  </div>

  <footer>
    បង្កើតឡើងសម្រាប់និស្សិត — សូមចែករំលែកដល់មិត្តភក្តិ<br>
    <span style="opacity:.6">ចម្លើយជាការណែនាំសិក្សា សូមផ្ទៀងផ្ទាត់ជាមួយគ្រូបង្រៀន</span>
  </footer>
</div>

<script>
const MC = [{"n":1,"q":"If you wanted a lightweight protocol to send real time data over, which of these would you use?","opts":["TCP","HTTP","ICMP","UDP"],"a":3,"e":"UDP គឺជា protocol ស្រាល គ្មាន connection និងគ្មាន retransmission ដូច្នេះសាកសមសម្រាប់ទិន្នន័យ real-time។"},{"n":2,"q":"What order, from bottom to top, does the TCP/IP architecture use?","opts":["Network Access, Network, Transport, Application","Link, Internet, Transport, Application","Physical, Network, Session, Application","Data Link, Internet, Transport, Application"],"a":1,"e":"ស្ថាបត្យកម្ម TCP/IP មាន ៤ ស្រទាប់ ពីក្រោមឡើងលើ៖ Link → Internet → Transport → Application។"},{"n":3,"q":"Which of these services would be considered a storage as a service solution?","opts":["Microsoft Azure","iCloud","Google Compute","DropLeaf"],"a":1,"e":"iCloud ជាសេវា storage as a service។ Azure និង Google Compute ជា IaaS/compute។"},{"n":4,"q":"The UDP headers contain which of the following fields?","opts":["Source address, destination address, checksum, length","Destination port, source port, checksum, length","Flags, source port, destination port, checksum","Length, checksum, flags, address"],"a":1,"e":"UDP header មាន ៤ វាល៖ source port, destination port, length, checksum។ Address ស្ថិតនៅក្នុង IP header។"},{"n":5,"q":"What are the three steps in the TCP handshake as described by the flags set?","opts":["SYN, SYN/URG, RST","RST, SYN, ACK","SYN, SYN/ACK, ACK","SYN, SYN/ACK, ACK/URG"],"a":2,"e":"TCP three-way handshake គឺ SYN → SYN/ACK → ACK។"},{"n":6,"q":"Which of these protocols would be used to communicate with an IoT device?","opts":["ICMP","SMTP","Telnet","HTTP"],"a":3,"e":"ឧបករណ៍ IoT ភាគច្រើនទំនាក់ទំនងតាម HTTP/REST API។"},{"n":7,"q":"Which network topology are you most likely to run across in a large enterprise network?","opts":["Ring topology","Bus topology","Full mesh","Star bus hybrid"],"a":3,"e":"បណ្ដាញសហគ្រាសធំៗ ភាគច្រើនប្រើ star-bus hybrid (switch ជា star, ភ្ជាប់គ្នាជា backbone)។"},{"n":8,"q":"If you were to see ID","Injecting four way handshakes"],"a":1,"e":"Evil twin ដំណើរការដោយ spoofing SSID របស់បណ្ដាញស្របច្បាប់។"},{"n":109,"q":"What is a method to successfully get malware onto a mobile device without having to get the user to do something they wouldn't normally do?","opts":["Using the Apple Store or Google Play Store","Using external storage on an Android","Using a third party app store","Jailbreaking"],"a":2,"e":"Third-party app store គឺជាកន្លែងដែលអ្នកប្រើទាញយក app ធម្មតា ដូច្នេះមិនត្រូវការបញ្ឆោតបន្ថែម។"},{"n":110,"q":"What would you use a bluebugging attack for?","opts":["Identifying Bluetooth devices nearby","Listening to a physical space","Enabling a phone's camera","Gathering data from a target system"],"a":1,"e":"Bluebugging គ្រប់គ្រងទូរស័ព្ទ អាចបើក microphone ដើម្បីស្ដាប់សំឡេងជុំវិញ។"},{"n":111,"q":"Why is bluesnarfing potentially more dangerous than bluejacking from the standpoint of the victim?","opts":["Bluejacking sends while bluesnarfing receives.","Bluejacking receives while bluesnarfing sends.","Bluejacking installs keyloggers.","Bluesnarfing installs keyloggers."],"a":0,"e":"Bluejacking គ្រាន់តែផ្ញើសារចូល ចំណែក Bluesnarfing ទាញយកទិន្នន័យចេញ — គ្រោះថ្នាក់ជាង។"},{"n":112,"q":"What tool would allow you to run an evil twin attack?","opts":["Wireshark","Ettercap","wifiphisher","aircrack ng"],"a":2,"e":"wifiphisher បង្កើត rogue AP ស្វ័យប្រវត្តិសម្រាប់ evil twin attack។"},{"n":113,"q":"What types of authentication are allowed in a WPA encrypted network?","opts":["Handshake and personal","Personal and enterprise","Enterprise and handshake","802.11 and personal"],"a":1,"e":"WPA អនុញ្ញាត ២ របៀប៖ Personal (PSK) និង Enterprise (802.1X/RADIUS)។"},{"n":114,"q":"What wouldn't you see when you capture wireless traffic that includes radio headers?","opts":["Capabilities","Probe requests","SSIDs","Network type"],"a":1,"e":"Radio header + beacon frame បង្ហាញ capabilities, SSID និង network type។ Probe request ជា frame ដាច់ដោយឡែក មិនមែនព័ត៌មានក្នុង header ទេ។"},{"n":115,"q":" const SA = [{"n":1,"q":"តើ CIA ជាអ្វី នៅក្នុង Cybersecurity?","a":"CIA Triad ជាគ្រឹះនៃសន្តិសុខព័ត៌មាន មាន ៣ ធាតុ៖\n\n• **Confidentiality (ការសម្ងាត់)** — ធានាថាមានតែអ្នកមានសិទ្ធិទេទើបចូលមើលទិន្នន័យបាន។ ឧបករណ៍៖ Encryption, Access Control, MFA។\n• **Integrity (ភាពត្រឹមត្រូវ)** — ធានាថាទិន្នន័យមិនត្រូវបានកែប្រែដោយគ្មានការអនុញ្ញាត។ ឧបករណ៍៖ Hashing (SHA-256), Digital Signature, Checksum។\n• **Availability (ភាពអាចប្រើបាន)** — ធានាថាប្រព័ន្ធនិងទិន្នន័យអាចប្រើបាននៅពេលត្រូវការ។ ឧបករណ៍៖ Backup, Redundancy, DDoS protection។\n\nការវាយប្រហារនីមួយៗតែងតែបំពានលើធាតុមួយ ឬច្រើនក្នុងចំណោមនេះ។"},{"n":2,"q":"ចូររាប់ពីប្រភេទនៃ Cyber Attacks","a":"ប្រភេទសំខាន់ៗ៖\n\n• **Malware** — Virus, Worm, Trojan, Ransomware, Spyware, Rootkit, Botnet\n• **Social Engineering** — Phishing, Spear phishing, Vishing, Smishing, Pretexting, Baiting, Tailgating\n• **Password Attacks** — Brute force, Dictionary, Rainbow table, Credential stuffing, Keylogging\n• **Network Attacks** — Man-in-the-Middle (MitM), Sniffing, Spoofing (IP/ARP/DNS), Session hijacking\n• **DoS / DDoS** — SYN flood, Smurf, Amplification attack\n• **Web Application Attacks** — SQL Injection, XSS, CSRF, Directory traversal, File inclusion\n• **Wireless Attacks** — Evil twin, Deauthentication, KRACK, WEP cracking, Bluesnarfing\n• **Zero-day & Supply chain attacks** — ប្រើភាពងាយរងគ្រោះដែលមិនទាន់មានបំណះ"},{"n":3,"q":"តើគេប្រើប្រាស់ fping និង MegaPing សម្រាប់ធ្វើអ្វី?","a":"ទាំងពីរប្រើសម្រាប់ **Host Discovery / Network Scanning** — គឺរកមើលថាម៉ាស៊ីនណាខ្លះកំពុងដំណើរការនៅក្នុងបណ្ដាញ។\n\n• **fping** — កម្មវិធី command-line លើ Linux។ ខុសពី ping ធម្មតាត្រង់វាអាច ping IP ច្រើនក្នុងពេលតែមួយ (parallel) និងទទួលយក range ឬ file បញ្ជី IP។ ឧ. `fping -a -g 192.168.1.0/24`។ ប្រើសម្រាប់ **ping sweep** ដើម្បីធ្វើផែនទីបណ្ដាញយ៉ាងលឿន។\n\n• **MegaPing** — ឧបករណ៍ GUI លើ Windows ដែលរួមបញ្ចូល IP scanner, Port scanner, NetBIOS scanner, Share scanner, Traceroute, Whois និង DNS lookup ក្នុងកម្មវិធីតែមួយ។\n\nទាំងពីរស្ថិតក្នុងដំណាក់កាល **Reconnaissance / Scanning** នៃ ethical hacking។"},{"n":4,"q":"ចូររាប់ពី Port Scanning នៅក្នុង nmap","a":"ប្រភេទ scan សំខាន់ៗក្នុង nmap៖\n\n• **-sS — SYN / Half-open scan** — ផ្ញើ SYN, បើទទួល SYN/ACK = open រួចផ្ញើ RST មិនបញ្ចប់ handshake។ លឿន និងស្ងាត់ (default សម្រាប់ root)។\n• **-sT — TCP Connect scan** — បញ្ចប់ three-way handshake ពេញលេញ។ ងាយត្រូវចាប់បាន តែមិនត្រូវការសិទ្ធិ root។\n• **-sU — UDP scan** — scan port UDP។ យឺត ព្រោះត្រូវរង់ចាំ ICMP Port Unreachable។\n• **-sA — ACK scan** — មិនប្រាប់ថា port បើកឬបិទ តែប្រាប់ថា filtered ឬ unfiltered → ប្រើ map ច្បាប់ firewall។\n• **-sF / -sX / -sN — FIN, Xmas, Null scan** — ផ្ញើ flag ចម្លែក ដើម្បីគេច firewall សាមញ្ញ។ Port បិទឆ្លើយ RST, port បើកមិនឆ្លើយ។\n• **-sI — Idle / Zombie scan** — ប្រើម៉ាស៊ីនទីបី លាក់អត្តសញ្ញាណពិត។\n• **-sV** — រកកំណែ service | **-O** — រក OS | **-sn** — ping sweep (គ្មាន port scan) | **-p-** — scan គ្រប់ ៦៥៥៣៥ port\n\nស្ថានភាព port៖ open, closed, filtered, unfiltered, open|filtered, closed|filtered។"},{"n":5,"q":"ចូររាប់ពីប្រភេទ Malware មានអ្វីខ្លះ?","a":"• **Virus** — ភ្ជាប់ខ្លួនទៅ file/program ត្រូវការអ្នកប្រើដំណើរការវា ទើបរាលដាល។\n• **Worm** — ចម្លងខ្លួនឯងតាមបណ្ដាញ **ដោយមិនត្រូវការអ្នកប្រើ**។\n• **Trojan** — ក្លែងខ្លួនជាកម្មវិធីមានប្រយោជន៍ តែលាក់មុខងារព្យាបាទ។\n• **Ransomware** — អ៊ិនគ្រីបឯកសារ រួចទាមទារថ្លៃលោះ។\n• **Spyware / Keylogger** — លួចតាមដានសកម្មភាព និងវាយបញ្ចូលក្តារចុច។\n• **Adware** — បង្ហាញផ្សាយពាណិជ្ជកម្មរំខាន និងតាមដានទម្លាប់។\n• **Rootkit** — លាក់ខ្លួននៅកម្រិតជ្រៅ (kernel) លាក់ process និង file។\n• **Backdoor** — បើកផ្លូវចូលសម្ងាត់សម្រាប់អ្នកវាយប្រហារ។\n• **Bot / Botnet** — ធ្វើឱ្យម៉ាស៊ីនក្លាយជា 'zombie' ស្តាប់បញ្ជា C&C ដើម្បីវាយ DDoS។\n• **Dropper / Downloader** — ដំណាក់កាលទី១ ដែលទាញយក malware បន្ថែម។\n• **Fileless malware** — ដំណើរការក្នុង memory (ឧ. PowerShell) មិនសរសេរ file លើ disk។\n• **Logic bomb** — ផ្ទុះនៅពេលលក្ខខណ្ឌណាមួយកើតឡើង។"},{"n":6,"q":"តើ Social Engineering មានអ្វីខ្លះ?","a":"Social Engineering = ការបញ្ឆោត **មនុស្ស** (មិនមែនបច្ចេកវិទ្យា) ដើម្បីទទួលបានព័ត៌មាន ឬសិទ្ធិចូល។\n\n**ប្រភេទ៖**\n• **Phishing** — email ក្លែងក្លាយ | **Spear phishing** — សំដៅបុគ្គលជាក់លាក់ | **Whaling** — សំដៅថ្នាក់ដឹកនាំ\n• **Vishing** — តាមទូរស័ព្ទ | **Smishing** — តាម SMS\n• **Pretexting** — បង្កើតរឿងក្លែងក្លាយគួរឱ្យជឿ\n• **Baiting** — ទុក USB ឆ្លងមេរោគឱ្យគេរើស\n• **Quid pro quo** — ផ្ដល់ 'ជំនួយ' ជាថ្នូរនឹងព័ត៌មាន (ឧ. ក្លែងជា Help desk)\n• **Tailgating / Piggybacking** — ដើរតាមក្រោយបុគ្គលិកចូលអគារ\n• **Impersonation** — ក្លែងខ្លួនជាជាងជួសជុល អ្នកដឹកជញ្ជូន ឬអ្នកគ្រប់គ្រង\n• **Dumpster diving / Shoulder surfing** — រុករកសំរាម / លបមើលពីក្រោយស្មា\n\n**គោលការណ៍ចិត្តសាស្ត្រដែលគេប្រើ៖** Authority, Urgency, Scarcity, Social proof, Reciprocity, Liking, Fear។\n\n**ការពារ៖** បណ្ដុះបណ្ដាលបុគ្គលិក, ផ្ទៀងផ្ទាត់អត្តសញ្ញាណ, MFA, គោលនយោបាយច្បាស់លាស់។"},{"n":7,"q":"ចូររាប់ពីប្រភេទនៃ WiFi IEEE Standard 802.11 មានអ្វីខ្លះ?","a":"| ស្តង់ដារ | ឆ្នាំ | ប្រេកង់ | ល្បឿនអតិបរមា |\n|---|---|---|---|\n| 802.11 (original) | 1997 | 2.4 GHz | 2 Mbps |\n| **802.11a** | 1999 | 5 GHz | 54 Mbps |\n| **802.11b** | 1999 | 2.4 GHz | 11 Mbps |\n| **802.11g** | 2003 | 2.4 GHz | 54 Mbps |\n| **802.11n** (Wi-Fi 4) | 2009 | 2.4 + 5 GHz | 600 Mbps (MIMO) |\n| **802.11ac** (Wi-Fi 5) | 2013 | 5 GHz | ~3.5 Gbps (MU-MIMO) |\n| **802.11ax** (Wi-Fi 6 / 6E) | 2019 | 2.4 + 5 (+6) GHz | ~9.6 Gbps (OFDMA) |\n| **802.11be** (Wi-Fi 7) | 2024 | 2.4 + 5 + 6 GHz | ~46 Gbps |\n\n**ស្តង់ដារពាក់ព័ន្ធសន្តិសុខ៖** 802.11i (WPA2/AES-CCMP), 802.1X (Enterprise authentication)។\n**ការវិវត្តនៃការអ៊ិនគ្រីប៖** WEP (ខូច) → WPA (TKIP) → WPA2 (AES-CCMP) → WPA3 (SAE)។"},{"n":8,"q":"តើ Wireless Footprinting ជាអ្វី?","a":"**Wireless Footprinting** ជាដំណាក់កាលប្រមូលព័ត៌មានអំពីបណ្ដាញឥតខ្សែរបស់គោលដៅ — មុនពេលវាយប្រហារពិតប្រាកដ។\n\n**គោលបំណងគឺរក៖** SSID (រួមទាំង hidden), BSSID/MAC របស់ AP, channel, ប្រភេទអ៊ិនគ្រីប (WEP/WPA/WPA2/WPA3), កម្លាំងសញ្ញា, បញ្ជី client ដែលភ្ជាប់, និងព្រំដែនរូបវន្តនៃសញ្ញា។\n\n**វិធីសាស្ត្រ៖**\n• **Wardriving** — បើកឡានកាន់ laptop/GPS ស្កេនបណ្ដាញតាមផ្លូវ (ក៏មាន warwalking, warflying)\n• **Passive sniffing** — ដាក់ NIC ក្នុង **monitor mode** ស្ដាប់ beacon frame ដោយមិនផ្ញើអ្វី (រកមិនឃើញ)\n• **Active probing** — ផ្ញើ probe request ដើម្បីបង្ខំ AP ឆ្លើយតប\n• **Directional antenna** — ឧ. cantenna ធ្វើពីកំប៉ុង Pringles ដើម្បីចាប់សញ្ញាពីចម្ងាយ\n\n**ឧបករណ៍៖** Kismet, airodump-ng (aircrack-ng suite), inSSIDer, NetStumbler, Wireshark, WiGLE.net។"},{"n":9,"q":"តើអ្វីជា Denial of Service Attacks?","a":"**DoS** = ការវាយប្រហារដែលធ្វើឱ្យសេវាមិនអាចប្រើបាន សម្រាប់អ្នកប្រើស្របច្បាប់ — វាយប្រហារលើ **Availability** នៃ CIA Triad។ បើវាយពីម៉ាស៊ីនច្រើន (botnet) ព្រមគ្នា ហៅថា **DDoS**។\n\n**ប្រភេទ៖**\n• **Volumetric** — បំពេញ bandwidth៖ UDP flood, ICMP flood, DNS/NTP **amplification**\n• **Protocol attack** — ធ្វើឱ្យអស់ធនធាន៖ **SYN flood** (បើក half-open connection ច្រើន), Ping of Death, Smurf, Teardrop\n• **Application layer** — HTTP flood, Slowloris (បើក connection ទុកយូរៗ)\n• **Distributed (DDoS)** — botnet រាប់ពាន់ម៉ាស៊ីនវាយក្នុងពេលតែមួយ\n\n**ការការពារ៖** Rate limiting, SYN cookies, Firewall/IPS, CDN និងសេវា DDoS mitigation (Cloudflare, Akamai), Anycast, Blackhole routing, Load balancing។"}];
const CATS = [
 {id:0,km:"មូលដ្ឋានបណ្ដាញ",en:"Networking",a:1,b:12},
 {id:1,km:"មូលដ្ឋានសន្តិសុខ",en:"Security Foundations",a:13,b:27},
 {id:2,km:"ការស៊ើបអង្កេត",en:"Footprinting & Recon",a:28,b:38},
 {id:3,km:"ការស្កេន",en:"Scanning",a:39,b:47},
 {id:4,km:"វាយចូលប្រព័ន្ធ",en:"System Hacking",a:48,b:64},
 {id:5,km:"មេរោគ",en:"Malware",a:65,b:80},
 {id:6,km:"វិស្វកម្មសង្គម",en:"Social Engineering",a:81,b:96},
 {id:7,km:"ឥតខ្សែ និងទូរស័ព្ទ",en:"Wireless & Mobile",a:97,b:117},
];
const KH = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
const kn = n => String(n).split('').map(d=>KH[+d]||d).join('');

let mode='study', selCats=new Set(['all']), selCount=20;
let queue=[], idx=0, answers=[], startTime=0, timerId=null, elapsed=0;

function show(id){
  ['home','setup','quiz','result','flash'].forEach(x=>document.getElementById(x).classList.add('hide'));
  document.getElementById(id).classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
  if(timerId && id!=='quiz'){clearInterval(timerId);timerId=null;}
}

/* ---------- setup ---------- */
function renderCats(){
  const box=document.getElementById('catChips');
  box.innerHTML='';
  const mk=(label,val)=>{
    const b=document.createElement('button');
    b.className='chip'+(selCats.has(val)?' on':'');
    b.innerHTML=label;
    b.onclick=()=>{
      if(val==='all'){selCats=new Set(['all']);}
      else{
        selCats.delete('all');
        selCats.has(val)?selCats.delete(val):selCats.add(val);
        if(!selCats.size)selCats=new Set(['all']);
      }
      renderCats();
    };
    box.appendChild(b);
  };
  mk('មេរៀនទាំងអស់ ('+kn(117)+')','all');
  CATS.forEach(c=>mk(c.km+' <span style="opacity:.6">('+kn(c.b-c.a+1)+')</span>',c.id));
}
function renderCounts(){
  const pool=poolSize();
  const box=document.getElementById('countChips');
  box.innerHTML='';
  [10,20,30,50,pool].filter((v,i,a)=>v<=pool && a.indexOf(v)===i).forEach(v=>{
    const b=document.createElement('button');
    b.className='chip'+(selCount===v?' on':'');
    b.textContent=(v===pool?'ទាំងអស់ ':'')+kn(v);
    b.onclick=()=>{selCount=v;renderCounts();};
    box.appendChild(b);
  });
}
function poolSize(){return filtered().length;}
function filtered(){
  if(selCats.has('all'))return MC.slice();
  return MC.filter(q=>[...selCats].some(id=>{const c=CATS[id];return q.n>=c.a&&q.n<=c.b;}));
}
function startStudySetup(){
  mode='study';
  document.getElementById('setupTitle').textContent='📖 របៀបរៀន';
  document.getElementById('countBox').classList.add('hide');
  renderCats(); show('setup');
}
function startExamSetup(){
  mode='exam';
  document.getElementById('setupTitle').textContent='⏱️ របៀបប្រឡង';
  document.getElementById('countBox').classList.remove('hide');
  renderCats();
  const old=document.getElementById('catChips').onclick;
  renderCounts(); show('setup');
  document.getElementById('catChips').addEventListener('click',()=>setTimeout(()=>{ if(selCount>poolSize())selCount=poolSize(); renderCounts();},0));
}

/* ---------- quiz ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function beginQuiz(){
  let pool=filtered();
  if(!pool.length){alert('សូមជ្រើសរើសមេរៀនយ៉ាងតិចមួយ');return;}
  if(mode==='exam'){
    pool=shuffle(pool.slice()).slice(0,Math.min(selCount,pool.length));
    queue=pool.map(q=>{
      const order=shuffle([0,1,2,3]);
      return {...q,order};
    });
  }else{
    queue=pool.slice().sort((x,y)=>x.n-y.n).map(q=>({...q,order:[0,1,2,3]}));
  }
  idx=0; answers=new Array(queue.length).fill(null);
  elapsed=0; startTime=Date.now();
  if(mode==='exam'){
    timerId=setInterval(tick,1000);
  }
  document.getElementById('timer').textContent = mode==='exam'?'00:00':'';
  show('quiz'); render();
}
function tick(){
  elapsed=Math.floor((Date.now()-startTime)/1000);
  const m=String(Math.floor(elapsed/60)).padStart(2,'0'), s=String(elapsed%60).padStart(2,'0');
  document.getElementById('timer').textContent=m+':'+s;
}
function render(){
  const q=queue[idx];
  document.getElementById('qCounter').textContent='សំណួរ '+kn(idx+1)+' / '+kn(queue.length)+(mode==='study'?'  •  #'+kn(q.n):'');
  document.getElementById('progBar').style.width=((idx+1)/queue.length*100)+'%';
  document.getElementById('qText').textContent=q.q;
  const ob=document.getElementById('opts'); ob.innerHTML='';
  const fb=document.getElementById('feedback'); fb.innerHTML='';
  const given=answers[idx];
  q.order.forEach((origIdx,pos)=>{
    const b=document.createElement('button');
    b.className='opt en';
    b.innerHTML='<span class="k">'+'ABCD'[pos]+'</span><span>'+esc(q.opts[origIdx])+'</span>';
    if(given!==null){
      b.classList.add('locked');
      if(mode==='study'){
        if(origIdx===q.a)b.classList.add('ok');
        else if(origIdx===given)b.classList.add('no');
      }else{
        if(origIdx===given)b.classList.add('sel');
      }
    }else{
      b.onclick=()=>pick(origIdx);
    }
    ob.appendChild(b);
  });
  if(given!==null && mode==='study')showExpl(q,given);
  document.getElementById('btnPrev').disabled = idx===0;
  const nb=document.getElementById('btnNext');
  nb.textContent = idx===queue.length-1 ? (mode==='exam'?'បញ្ចប់ និងមើលពិន្ទុ':'មើលលទ្ធផល') : 'បន្ទាប់ →';
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function showExpl(q,given){
  const fb=document.getElementById('feedback');
  const ok=given===q.a;
  fb.innerHTML='<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'✓ ត្រឹមត្រូវ!':'✗ មិនត្រឹមត្រូវ — ចម្លើយត្រូវគឺ '+'ABCD'[q.order.indexOf(q.a)])+'</div>'
    +'<div class="expl"><b>ការពន្យល់</b>'+q.e+'</div>';
}
function pick(origIdx){
  answers[idx]=origIdx;
  const q=queue[idx];
  if(mode==='study'){render();}
  else{
    render();
    setTimeout(()=>{ if(idx<queue.length-1){idx++;render();} },220);
  }
}
function nav(d){
  if(d>0 && idx===queue.length-1){finish();return;}
  idx=Math.max(0,Math.min(queue.length-1,idx+d));
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function quitQuiz(){ if(confirm('បញ្ឈប់មែនទេ? លទ្ធផលនឹងបាត់។')) show('home'); }

function finish(){
  if(timerId){clearInterval(timerId);timerId=null;}
  const total=queue.length;
  let correct=0;
  queue.forEach((q,i)=>{if(answers[i]===q.a)correct++;});
  const pct=Math.round(correct/total*100);
  document.getElementById('scorePct').textContent=kn(pct)+'%';
  document.getElementById('scoreText').textContent='ត្រូវ '+kn(correct)+' ក្នុងចំណោម '+kn(total)+' សំណួរ';
  const g=document.getElementById('scoreGrade');
  let label,col;
  if(pct>=90){label='ពូកែណាស់! 🏆';col='var(--acc)';}
  else if(pct>=75){label='ល្អ! 👍';col='var(--acc2)';}
  else if(pct>=60){label='ជាប់ — នៅត្រូវរៀនបន្ថែម';col='var(--warn)';}
  else{label='ត្រូវរៀនឡើងវិញ 📚';col='var(--bad)';}
  g.textContent=label; g.style.background=col; g.style.color='#0b1020';
  const m=Math.floor(elapsed/60), s=elapsed%60;
  document.getElementById('scoreTime').textContent = mode==='exam' ? 'ពេលវេលា៖ '+kn(m)+' នាទី '+kn(s)+' វិនាទី' : '';
  const wrong=queue.map((q,i)=>({q,g:answers[i]})).filter(x=>x.g!==x.q.a);
  const rb=document.getElementById('reviewBox');
  if(!wrong.length){rb.innerHTML='<div class="card" style="text-align:center;color:var(--acc);font-weight:700">🎉 ត្រូវទាំងអស់! គ្មានអ្វីត្រូវពិនិត្យឡើងវិញទេ។</div>';}
  else{
    rb.innerHTML='<div class="card"><div style="font-weight:700;margin-bottom:12px">ពិនិត្យឡើងវិញ ('+kn(wrong.length)+' សំណួរខុស)</div>'
      + wrong.map(x=>'<div class="review-item">'
        +'<div class="r1 en">#'+x.q.n+'. '+esc(x.q.q)+'</div>'
        +(x.g===null?'<div class="r2">មិនបានឆ្លើយ</div>':'<div class="r2 en">✗ អ្នកឆ្លើយ៖ '+esc(x.q.opts[x.g])+'</div>')
        +'<div class="r3 en">✓ ចម្លើយត្រូវ៖ '+esc(x.q.opts[x.q.a])+'</div>'
        +'<div class="r4">'+x.q.e+'</div></div>').join('')+'</div>';
  }
  saveBest(pct);
  show('result');
}
function retry(){ mode==='exam'?startExamSetup():startStudySetup(); }
function saveBest(p){try{const k='cyberquiz_best';const b=+(localStorage.getItem(k)||0);if(p>b)localStorage.setItem(k,p);}catch(e){}}

/* ---------- flashcards ---------- */
function md(s){
  const lines=s.split('\n'); let out='',ul=false,tbl=[];
  const flushUl=()=>{if(ul){out+='</ul>';ul=false;}};
  const flushTbl=()=>{
    if(!tbl.length)return;
    const rows=tbl.filter(r=>!/^\|[\s\-:|]+\|$/.test(r.trim()));
    let h='<div class="tblwrap"><table>';
    rows.forEach((r,i)=>{
      const cells=r.split('|').slice(1,-1).map(c=>inline(c.trim()));
      h+='<tr>'+cells.map(c=>i===0?'<th>'+c+'</th>':'<td>'+c+'</td>').join('')+'</tr>';
    });
    out+=h+'</table></div>'; tbl=[];
  };
  lines.forEach(L=>{
    const t=L.trim();
    if(t.startsWith('|')){flushUl();tbl.push(t);return;}
    flushTbl();
    if(t.startsWith('• ')){ if(!ul){out+='<ul>';ul=true;} out+='<li>'+inline(t.slice(2))+'</li>'; return; }
    flushUl();
    if(t)out+='<p>'+inline(t)+'</p>';
  });
  flushUl();flushTbl();
  return out;
}
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function renderFlash(){
  const box=document.getElementById('fcList');
  box.innerHTML='<div class="card" style="margin-bottom:14px"><div style="font-weight:700">🗂️ សំណួរខ្លី — Short Answer</div>'
    +'<div style="color:var(--dim);font-size:.86rem;margin-top:4px">ព្យាយាមឆ្លើយក្នុងចិត្តសិន រួចចុចដើម្បីមើលចម្លើយគំរូ</div></div>';
  SA.forEach(c=>{
    const d=document.createElement('div');
    d.className='fc';
    d.innerHTML='<button><span class="n">'+kn(c.n)+'</span><span>'+esc(c.q)+'</span><span class="ar">▶</span></button>'
      +'<div class="fcbody">'+md(c.a)+'</div>';
    d.querySelector('button').onclick=()=>d.classList.toggle('open');
    box.appendChild(d);
  });
}
renderFlash();
</script>
